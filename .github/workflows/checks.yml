name: Checks

# The gate for every push and PR, and — via workflow_call — the gate the deploy reuses.
# `upload-dist` hands the built bundle to the deploy job so the server never runs Node.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      upload-dist:
        type: boolean
        default: false
      api-base:
        type: string
        default: ''
      landing-base:
        type: string
        default: ''
      # FE-1: real E-IMZO mode is an explicit per-environment opt-in, never a
      # default (src/lib/eimzo/index.ts::isEimzoMock — unset means mock).
      # Left blank here on purpose for a plain push/PR build: that resolves
      # to mock, the safe default, exactly like every unset VITE_EIMZO_MOCK.
      eimzo-mock:
        type: string
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build
        env:
          # Baked into the bundle at build time; without it the browser calls localhost.
          VITE_API_BASE: ${{ inputs.api-base }}
          # Same mechanism: where the login page's "home" and "verify" links go.
          VITE_LANDING_BASE_URL: ${{ inputs.landing-base }}
          # FE-1: baked in at build time, same as VITE_API_BASE above — never
          # left to the runtime default alone. Blank here (plain push/PR) or
          # any value other than the literal "false" bakes in mock mode.
          VITE_EIMZO_MOCK: ${{ inputs.eimzo-mock }}
        run: npm run build

      # The build succeeding is not the same as the bundle being usable: a
      # missing MapLibre worker breaks the map with no error anywhere. See the
      # script's own header for why this cannot be a unit test.
      - name: Check the bundle
        run: ./scripts/check-bundle.sh dist

      - name: Upload the bundle
        if: ${{ inputs.upload-dist }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
